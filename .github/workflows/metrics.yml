name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: N28888
          filename: github-metrics.svg
          committer_branch: main
          committer_message: "chore: update metrics"
          base: header, activity, community, repositories, metadata
          template: classic
          config_timezone: America/Toronto
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_lines: yes
          plugin_traffic: yes
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: Languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: N28888
          filename: metrics.plugin.languages.svg
          committer_branch: main
          committer_message: "chore: update language metrics"
          base: ""
          template: classic
          config_timezone: America/Toronto
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 300
          plugin_languages_details: percentage, bytes-size
          plugin_languages_other: yes

      - name: Detailed languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: N28888
          filename: metrics.plugin.languages.details.svg
          committer_branch: main
          committer_message: "chore: update detailed language metrics"
          base: ""
          template: classic
          config_timezone: America/Toronto
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_other: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming, data
          plugin_languages_recent_categories: markup, programming, data
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 300

      - name: Isometric calendar metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: N28888
          filename: metrics.plugin.isocalendar.svg
          committer_branch: main
          committer_message: "chore: update isocalendar metrics"
          base: ""
          template: classic
          config_timezone: America/Toronto
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
